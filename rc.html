<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>扑翼机 · 蓝牙遥控（手机版）</title>
<style>
  :root{ --bg:#111418; --fg:#e6edf3; --dim:#8b949e; --acc:#2f81f7; --warn:#d29922; --bad:#f85149; --ok:#3fb950; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:10px 12px 24px; }
  h1{ font-size:16px; margin:2px 0 8px; font-weight:600; }
  .row{ display:flex; gap:8px; margin-bottom:8px; }
  button{ flex:1; padding:14px 8px; font-size:15px; font-weight:600; border:0; border-radius:10px;
          background:#21262d; color:var(--fg); }
  button:active{ transform:scale(0.97); }
  button.pri{ background:var(--acc); color:#fff; }
  button.stop{ background:var(--bad); color:#fff; }
  button.ok{ background:#238636; color:#fff; }
  button:disabled{ opacity:.4; }
  .stat{ font-size:12px; color:var(--dim); background:#161b22; border-radius:8px; padding:8px;
         margin-bottom:10px; line-height:1.6; word-break:break-all; }
  .stat b{ color:var(--fg); font-weight:600; }
  .ctl{ background:#161b22; border-radius:12px; padding:10px 12px 6px; margin-bottom:10px; }
  .ctl .lab{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:2px; }
  .ctl .val{ font-variant-numeric:tabular-nums; font-weight:700; font-size:18px; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:38px; background:transparent; margin:0; }
  input[type=range]::-webkit-slider-runnable-track{ height:10px; border-radius:5px; background:#30363d; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:32px; height:32px; margin-top:-11px;
      border-radius:50%; background:var(--acc); border:3px solid #fff2; }
  input[type=range].thr::-webkit-slider-thumb{ background:var(--warn); }
  .hint{ font-size:11px; color:var(--dim); margin:2px 0 8px; line-height:1.5; }
  #log{ height:150px; overflow-y:auto; font-family:ui-monospace,Consolas,monospace; font-size:11px;
        background:#0d1117; border-radius:8px; padding:8px; white-space:pre-wrap; word-break:break-all; }
  .k{ color:var(--dim); }
</style>
</head>
<body>
<h1>扑翼机 · 蓝牙遥控（手机版）</h1>

<div class="row">
  <button id="btnConn" class="pri">连接 JDY-23</button>
  <button id="btnStop" class="stop" disabled>急停</button>
</div>
<div class="row">
  <button id="btnCenter" disabled>回中</button>
  <button id="btnStep" disabled>升降自检</button>
  <button id="btnExitD" disabled>退出直控</button>
</div>

<div class="stat" id="stat">未连接</div>

<div class="ctl">
  <div class="lab"><span>油门（≥45 才扑动）</span><span class="val" id="vThr">0</span></div>
  <input type="range" class="thr" id="thr" min="0" max="100" value="0">
</div>
<div class="ctl">
  <div class="lab"><span>差速（转向）</span><span class="val" id="vStr">50</span></div>
  <input type="range" id="str" min="0" max="100" value="50">
</div>
<div class="ctl">
  <div class="lab"><span>升降（俯仰）</span><span class="val" id="vLif">50</span></div>
  <input type="range" id="lif" min="0" max="100" value="50">
</div>

<div class="hint" id="hint"></div>
<div id="log"></div>

<script>
"use strict";
/* ============================================================
   协议：AA 55 | CMD | LEN | DATA | CK        CK = 全部字节异或
     0x01 油门 0~100   0x02 差速 0~100   0x04 升降 0~100
     0x03 急停 0/1     0x30 退出直控
   与飞控 flyer_fw 完全一致（和桌面版同一个 build_frame）
   ============================================================ */
const SVC = 0x0000ffe0, CH = 0x0000ffe1;   // JDY-23 手册 §6.1
const UUID = n => ('0000' + n.toString(16).padStart(4,'0') + '-0000-1000-8000-00805f9b34fb');
const FLY_MIN = 45;                        // 油门阈值（CH3=680+9.25T，启动阈值 1095）

function frame(cmd, data){
  const body = [0xAA, 0x55, cmd, data.length, ...data];
  let ck = 0; for (const b of body) ck ^= b;
  return new Uint8Array([...body, ck]);
}
const hex = b => [...b].map(x => x.toString(16).padStart(2,'0').toUpperCase()).join(' ');
const NAMES = {1:'油门',2:'差速',3:'急停',4:'升降',5:'交还电脑',0x30:'退出直控'};

const $ = id => document.getElementById(id);
let dev = null, ch = null, connected = false;
let vals = { thr:0, str:50, lif:50 };
let sent = { thr:null, str:null, lif:null };
let hbIdx = 0, nTx = 0, nRx = 0, nBad = 0, lastHb = 0, lastFc = '';
let writeMode = null;           // null=未定；true=带响应；false=无响应
let wakeLock = null;

function log(s){
  const el = $('log');
  const t = new Date().toTimeString().slice(0,8);
  el.textContent += `[${t}] ${s}\n`;
  if (el.textContent.length > 20000) el.textContent = el.textContent.slice(-12000);
  el.scrollTop = el.scrollHeight;
}
function setStat(s){ $('stat').innerHTML = s; }

/* ---------------- 连接 ---------------- */
async function connect(){
  if (!navigator.bluetooth){
    log('❌ 此浏览器不支持 Web Bluetooth');
    log('   Android 请用 Chrome/Edge；iOS Safari 不支持（这是系统限制）');
    return;
  }
  try{
    log('请求设备…（选名字含 JDY 的那个）');
    dev = await navigator.bluetooth.requestDevice({
      filters:[{ namePrefix:'JDY' }, { services:[SVC] }],
      optionalServices:[SVC]
    });
    dev.addEventListener('gattserverdisconnected', onDisconnected);
    log('连接 GATT…');
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    ch = await svc.getCharacteristic(CH);
    ch.addEventListener('characteristicvaluechanged', onNotify);
    await ch.startNotifications();
    connected = true;
    log(`已连接 ${dev.name || ''}，FFE1 通知已开启`);
    // 连接归一化：退直控 → 清急停 → 油门0
    await send(0x30, []); await send(0x03, [0]); await send(0x01, [0]);
    log('已发 退出直控 / 清急停 / 油门0');
    vals.thr = 0; vals.str = 50; vals.lif = 50;
    sent = { thr:null, str:null, lif:null };
    $('thr').value = 0; $('str').value = 50; $('lif').value = 50; syncLabels();
    for (const b of ['btnStop','btnCenter','btnStep','btnExitD']) $(b).disabled = false;
    $('btnConn').textContent = '断开';
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
  }catch(e){
    log('连接失败：' + e.message);
    if (String(e.message).includes('permission') || String(e.name).includes('Security'))
      log('提示：Web Bluetooth 需要安全上下文（https 或 localhost）');
  }
}
function onDisconnected(){
  connected = false; ch = null;
  log('⚠ 蓝牙已断开');
  $('btnConn').textContent = '连接 JDY-23';
  for (const b of ['btnStop','btnCenter','btnStep','btnExitD']) $(b).disabled = true;
  if (wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
}
function disconnect(){
  if (dev && dev.gatt.connected) dev.gatt.disconnect();
  else onDisconnected();
}

/* ---------------- 发送 ---------------- */
async function send(cmd, data, quiet){
  if (!connected || !ch) return false;
  const f = frame(cmd, data);
  try{
    if (writeMode !== true) {                    // 优先"无响应写"，时延最低
      try { await ch.writeValueWithoutResponse(f); writeMode = false; }
      catch(e){
        if (writeMode === false) throw e;
        await ch.writeValue(f); writeMode = true;   // 回退到带响应写
        log('写类型：带响应（模块只支持这种）');
      }
    } else { await ch.writeValue(f); }
    nTx++;
    if (!quiet) log(`→ ${hex(f)}   ${NAMES[cmd] || ('0x'+cmd.toString(16))}=[${data}]`);
    return true;
  }catch(e){
    log('发送失败：' + e.message);
    return false;
  }
}
/* 变化即发；无变化则每 300ms 轮询单通道保活（飞控 1s 超时） */
function tick(){
  if (!connected) return;
  const now = performance.now();
  const t = Math.round(vals.thr), s = Math.round(vals.str), l = Math.round(vals.lif);
  if (sent.thr !== t){ send(0x01,[t],true); sent.thr = t; }
  if (sent.str !== s){ send(0x02,[s],true); sent.str = s; }
  if (sent.lif !== l){ send(0x04,[l],true); sent.lif = l; }
  if (now - lastHb > 300){
    lastHb = now; hbIdx = (hbIdx + 1) % 3;
    const c = [[0x01,t],[0x02,s],[0x04,l]][hbIdx];
    send(c[0], [c[1]], true);
  }
}
setInterval(tick, 40);
setInterval(()=>{ if (connected) renderStat(); }, 200);

/* ---------------- 接收（解析飞控调试文本） ---------------- */
let txtBuf = '';
function onNotify(ev){
  const v = ev.target.value;                    // DataView
  const bytes = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  nRx += bytes.length;
  for (const b of bytes) txtBuf += String.fromCharCode(b);
  let i;
  while ((i = txtBuf.indexOf('\n')) >= 0){
    const line = txtBuf.slice(0, i).replace(/\r/g,'').trim();
    txtBuf = txtBuf.slice(i + 1);
    if (line) handleLine(line);
  }
  if (txtBuf.length > 400) txtBuf = txtBuf.slice(-200);
  renderStat();
}
const FC_KEYS = ['src','ppm','tk','pcT','ch3','fly','dct','rx','bad','lb'];
let fc = {};
function handleLine(line){
  const d = {};
  for (const tok of line.split(/\s+/)){
    const k = tok.split('=');
    if (k.length === 2 && FC_KEYS.includes(k[0])) d[k[0]] = k[1];
  }
  if (Object.keys(d).length && (d.src || d.rx)){
    const first = !Object.keys(fc).length;
    Object.assign(fc, d);
    if (first) log('← 飞控回传已同步，开始解析状态行');
    else if (Math.random() < 0.35) log('← ' + line.slice(0,64));   // 抽样显示，避免刷屏
  } else {
    nBad++;
    if (nBad <= 3) log('← 乱码: ' + line.slice(0,40));
  }
}
function renderStat(){
  const yn = k => fc[k] === '1' ? 'ON' : 'off';
  let s = connected
    ? `已连接 <b>${dev && dev.name ? dev.name : ''}</b>｜发送 <b>${nTx}</b> 帧｜接收 <b>${nRx}</b> 字节` +
      (nBad ? `｜乱码 ${nBad}` : '')
    : '未连接';
  if (connected && fc.src)
    s += `<br>飞控: 源=<b>${fc.src}</b> 遥控=${fc.ppm==='1'?'有效':'无'} 接管锁=${yn('tk')}` +
         ` 收到油门=<b>${fc.pcT}</b> CH3=${fc.ch3} 扑动=<b>${yn('fly')}</b> 直控=${yn('dct')}`;
  else if (connected && nRx > 0)
    s += `<br>收到 ${nRx} 字节但还不是状态行（波特率/固件调试输出未开？）`;
  else if (connected)
    s += '<br>尚未收到飞控回传（固件 DEBUG_SERIAL 是否=1？）';
  setStat(s);
}

/* ---------------- UI ---------------- */
function syncLabels(){
  $('vThr').textContent = Math.round(vals.thr);
  $('vStr').textContent = Math.round(vals.str);
  $('vLif').textContent = Math.round(vals.lif);
}
function bindSlider(id, key){
  const el = $(id);
  const upd = () => { vals[key] = +el.value; syncLabels(); };
  el.addEventListener('input', upd);
  el.addEventListener('change', upd);
}
bindSlider('thr','thr'); bindSlider('str','str'); bindSlider('lif','lif');

$('btnConn').onclick = () => connected ? disconnect() : connect();
$('btnStop').onclick = async () => {
  vals.thr = 0; $('thr').value = 0; syncLabels();
  await send(0x03,[1]); await send(0x01,[0]); sent.thr = 0;
  log('⚠ 急停');
};
$('btnCenter').onclick = async () => {
  vals.str = 50; vals.lif = 50; $('str').value = 50; $('lif').value = 50; syncLabels();
  await send(0x03,[0]); await send(0x02,[50]); await send(0x04,[50]);
  sent.str = 50; sent.lif = 50;
  log('已回中并清急停');
};
$('btnStep').onclick = async () => {
  log('升降阶跃：50 → 100（保持 2s）→ 50，注意看舵机臂');
  vals.lif = 100; $('lif').value = 100; syncLabels(); await send(0x04,[100]);
  setTimeout(async () => {
    vals.lif = 50; $('lif').value = 50; syncLabels(); await send(0x04,[50]);
    log('阶跃结束');
  }, 2000);
};
$('btnExitD').onclick = async () => { await send(0x30,[]); log('已发 0x30 退出直控'); };

(function initHint(){
  const ua = navigator.userAgent;
  const ios = /iPad|iPhone|iPod/.test(ua);
  let h = '';
  if (!navigator.bluetooth)
    h += '⚠ 此浏览器不支持 Web Bluetooth。Android 请用 <b>Chrome</b>；iOS 系统不支持（Safari/Chrome 都不行）。<br>';
  if (ios) h += '⚠ 检测到 iOS：系统不提供 Web Bluetooth，这个网页在 iPhone 上用不了。<br>';
  if (location.protocol !== 'https:' && location.hostname !== 'localhost')
    h += '⚠ 当前不是安全上下文（Web Bluetooth 要求 https 或 localhost）。<br>' +
         '　 手机上可访问 PC 起的本地服务 + 在 Chrome 打开 ' +
         '<code>chrome://flags/#unsafely-treat-insecure-origin-as-secure</code> 把本站加入白名单。<br>';
  h += '用法：连接 → 拖油门到 <b>≥45</b> 才会扑动；差速 A/D 转向，升降控制俯仰。';
  $('hint').innerHTML = h;
})();
</script>
</body>
</html>
