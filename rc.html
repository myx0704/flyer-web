<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>扑翼机 · 蓝牙遥控（手机版）</title>
<style>
  :root{ --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --acc:#2f81f7; --warn:#d29922;
         --bad:#f85149; --ok:#3fb950; --card:#161b22; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; }
  body{ background:var(--bg); color:var(--fg); padding:10px 12px 28px;
        font-family:-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC","Microsoft YaHei",sans-serif; }
  h1{ font-size:16px; margin:4px 0 10px; font-weight:600; }
  .row{ display:flex; gap:8px; margin-bottom:8px; }
  button{ flex:1; padding:15px 8px; font-size:16px; font-weight:600; border:0; border-radius:10px;
          background:#21262d; color:var(--fg); font-family:inherit; }
  button:active{ transform:scale(.97); }
  button.pri{ background:var(--acc); color:#fff; }
  button.stop{ background:var(--bad); color:#fff; }
  button.ok{ background:#238636; color:#fff; }
  button:disabled{ opacity:.35; }
  .stat{ font-size:12px; color:var(--dim); background:var(--card); border-radius:9px;
         padding:9px 10px; margin-bottom:10px; line-height:1.65; word-break:break-all; }
  .stat b{ color:var(--fg); }
  .ctl{ background:var(--card); border-radius:12px; padding:10px 12px 4px; margin-bottom:9px; }
  .lab{ display:flex; justify-content:space-between; align-items:baseline; font-size:14px; }
  .val{ font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:40px;
                     background:transparent; margin:0; }
  input[type=range]::-webkit-slider-runnable-track{ height:10px; border-radius:5px; background:#30363d; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:34px; height:34px;
      margin-top:-12px; border-radius:50%; background:var(--acc); border:3px solid rgba(255,255,255,.15); }
  input[type=range].thr::-webkit-slider-thumb{ background:var(--warn); }
  .hint{ font-size:11.5px; color:var(--dim); line-height:1.6; margin:4px 0 10px; }
  #log{ height:180px; overflow-y:auto; -webkit-overflow-scrolling:touch;
        font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; line-height:1.5;
        background:#010409; border-radius:9px; padding:9px; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<h1>🦅 扑翼机 · 蓝牙遥控</h1>

<div class="row">
  <button id="btnConnect" class="pri">连接 JDY-23</button>
  <button id="btnDisconnect" disabled>断开</button>
</div>
<div class="row">
  <button id="btnStop" class="stop" disabled>急停</button>
  <button id="btnCenter" disabled>回中</button>
</div>
<div class="row">
  <button id="btnStep" disabled>升降自检</button>
  <button id="btnExitD" disabled>退出直控</button>
</div>

<div class="stat" id="stat">未连接</div>

<div class="ctl">
  <div class="lab"><span>油门（≥45 才扑动）</span><span class="val" id="vThr">0</span></div>
  <input type="range" class="thr" id="thr" min="0" max="100" value="0">
</div>
<div class="ctl">
  <div class="lab"><span>差速（转向）</span><span class="val" id="vStr">50</span></div>
  <input type="range" id="str" min="0" max="100" value="50">
</div>
<div class="ctl">
  <div class="lab"><span>升降（俯仰）</span><span class="val" id="vLif">50</span></div>
  <input type="range" id="lif" min="0" max="100" value="50">
</div>

<div class="hint" id="hint"></div>
<div id="log"></div>

<script>
"use strict";
/* ============================================================
   协议：AA 55 | CMD | LEN | DATA | CK     CK = 全部字节异或
     0x01 油门 0~100   0x02 差速 0~100   0x04 升降 0~100
     0x03 急停 0/1     0x30 退出直控
   与飞控 flyer_fw / 桌面版完全一致
   ============================================================ */
const FFE0 = "0000ffe0-0000-1000-8000-00805f9b34fb";
const FFE1 = "0000ffe1-0000-1000-8000-00805f9b34fb";
const FLY_MIN = 45;                 // CH3 = 680+9.25T，启动阈值 CH3>1095

let device = null, ch = null, connected = false;
let nTx = 0, nRx = 0, nBad = 0;
let wakeLock = null;
let vals = { thr:0, str:50, lif:50 };
let pending = {};                   // 滑条节流：只保留最新值
let hbIdx = 0, lastHb = 0;

const $ = id => document.getElementById(id);
const hex = b => [...b].map(x => x.toString(16).padStart(2,'0').toUpperCase()).join(' ');

function log(s){
  const d = $('log'), t = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  d.textContent += '[' + t + '] ' + s + '\n';
  if (d.textContent.length > 24000) d.textContent = d.textContent.slice(-14000);
  d.scrollTop = d.scrollHeight;
}
function setStat(html){ $('stat').innerHTML = html; }

function buildFrame(cmd, data){
  data = data || [];
  const body = [0xAA, 0x55, cmd, data.length].concat(data);
  let ck = 0; for (const b of body) ck ^= b;
  return new Uint8Array(body.concat([ck]));
}

/* ---------- 写操作串行化（照抄旧版经验）----------
   ⚠ 并发写会抛 "GATT operation already in progress"，
     必须用 Promise 链把写操作排队。 */
let writeChain = Promise.resolve();
/* ⚠⚠ 必须用"带响应写" ch.writeValue()，不能用 writeValueWithoutResponse。
   本模块 FFE1 的属性是 [write, notify]，**不含 write-without-response**。
   而某些浏览器（iPhone 上的 Bluefy / WebBLE 等）调用
   writeValueWithoutResponse 时**既不抛错、也不真正把数据发出去** →
   日志显示"已发送"，飞控却一个字节都收不到。
   实测症状：手机端拖滑条日志满屏，而飞控回传 rx=46 冻结、pcT=0、src=NONE。
   （旧版能用就是因为它用的 writeValue。） */
function enqueueWrite(frame, tag){
  writeChain = writeChain.then(function(){
    if (!ch) throw new Error('未连接');
    return ch.writeValue(frame);
  }).then(function(){
    nTx++;
    if (tag) log('→ ' + hex(frame) + '   ' + tag);
  }).catch(function(e){ log('发送失败: ' + e.message); });
}

/* 滑条节流 50ms 合并 + 每 300ms 轮询单通道保活（飞控 1s 超时） */
setInterval(function(){
  if (!connected) return;
  const now = Date.now();
  ['thr','str','lif'].forEach(function(k){
    if (pending[k] !== undefined) {
      const v = pending[k]; pending[k] = undefined;
      const cmd = k === 'thr' ? 0x01 : (k === 'str' ? 0x02 : 0x04);
      enqueueWrite(buildFrame(cmd, [v]), k + '=' + v);
    }
  });
  if (now - lastHb > 300) {
    lastHb = now; hbIdx = (hbIdx + 1) % 3;
    const k = ['thr','str','lif'][hbIdx];
    const cmd = k === 'thr' ? 0x01 : (k === 'str' ? 0x02 : 0x04);
    enqueueWrite(buildFrame(cmd, [Math.round(vals[k])]), null);   // 保活不刷日志
  }
}, 50);
setInterval(function(){ if (connected) renderStat(); }, 250);

/* ---------- 连接 ----------
   ⚠ 用 acceptAllDevices:true（与能用的旧版一致）。
     iOS 上的第三方 Web Bluetooth 浏览器（Bluefy / WebBLE 等）通常
     不支持 namePrefix / services 过滤器 —— 用了它们会「点了没反应」。 */
async function connect(){
  if (!navigator.bluetooth){
    log('❌ 此浏览器不支持 Web Bluetooth');
    log('   Android：请用 Chrome / Edge');
    log('   iPhone/iPad：系统 Safari 与 Chrome 都不支持，需安装 Bluefy 或 WebBLE');
    return;
  }
  log('正在请求设备…（弹出的列表里选 JDY-23）');
  try{
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [FFE0]
    });
    log('已选择设备：' + (device.name || '(无名)'));
    device.addEventListener('gattserverdisconnected', onDisconnected);

    log('连接 GATT…');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(FFE0);
    ch = await service.getCharacteristic(FFE1);
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged', onNotify);
    connected = true;
    log('✓ FFE1 通知已开启');
    // 连接归一化：退出直控 → 清急停 → 油门 0
    enqueueWrite(buildFrame(0x30, []), '退出直控');
    enqueueWrite(buildFrame(0x03, [0]), '清急停');
    enqueueWrite(buildFrame(0x01, [0]), '油门0');
    vals = { thr:0, str:50, lif:50 };
    $('thr').value = 0; $('str').value = 50; $('lif').value = 50; syncLabels();
    ['btnDisconnect','btnStop','btnCenter','btnStep','btnExitD'].forEach(function(b){ $(b).disabled = false; });
    $('btnConnect').disabled = true;
    try { wakeLock = await navigator.wakeLock.request('screen'); log('屏幕常亮已开启'); }
    catch(e){ log('（屏幕常亮不可用，不影响遥控）'); }
  }catch(e){
    log('连接失败: ' + (e && e.message ? e.message : e));
    if (e && e.name === 'NotFoundError') log('（没有选择设备，或列表为空）');
  }
}
function onDisconnected(){
  connected = false; ch = null;
  log('⚠ 蓝牙已断开');
  $('btnConnect').disabled = false;
  ['btnDisconnect','btnStop','btnCenter','btnStep','btnExitD'].forEach(function(b){ $(b).disabled = true; });
  if (wakeLock) { try { wakeLock.release(); } catch(e){} wakeLock = null; }
}
function disconnect(){
  if (device && device.gatt.connected) device.gatt.disconnect();
  else onDisconnected();
}

/* ---------- 接收 ---------- */
let txtBuf = '';
let fc = {};
/* 发送有效性自检：飞控回传的 rx 计数必须随我们发送而增长。
   若发了十几帧它仍纹丝不动，说明字节没进飞控（线/写类型问题）。
   这个检查就是为了自动抓住"日志显示已发送、飞控却没收到"这类故障。 */
let rxBase = null, txBase = 0, rxOk = false;
const FC_KEYS = ['src','ppm','tk','pcT','ch3','fly','dct','rx','bad','lb'];
function onNotify(ev){
  const dv = ev.target.value;
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  nRx += bytes.length;
  for (let i = 0; i < bytes.length; i++) txtBuf += String.fromCharCode(bytes[i]);
  let i;
  while ((i = txtBuf.indexOf('\n')) >= 0){
    const line = txtBuf.slice(0, i).replace(/\r/g, '').trim();
    txtBuf = txtBuf.slice(i + 1);
    if (line) handleLine(line);
  }
  if (txtBuf.length > 400) txtBuf = txtBuf.slice(-200);
  renderStat();
}
function handleLine(line){
  const d = {};
  for (const tok of line.split(/\s+/)){
    const kv = tok.split('=');
    if (kv.length === 2 && FC_KEYS.indexOf(kv[0]) >= 0) d[kv[0]] = kv[1];
  }
  if (Object.keys(d).length && (d.src || d.rx)){
    const first = !Object.keys(fc).length;
    const oldBd = fc.bd;
    Object.assign(fc, d);
    // —— 发送有效性自检 ——
    if (fc.rx !== undefined){
      if (rxBase === null){ rxBase = +fc.rx; txBase = nTx; }
      else if (!rxOk && +fc.rx > rxBase){
        rxOk = true;
        log('✓ 飞控已收到我们发的字节（rx ' + rxBase + ' → ' + fc.rx + '）');
      }
    }
    if (first) log('← 飞控回传已同步，开始解析状态行');
    else if (d.bd !== undefined && d.bd !== oldBd) log('← 飞控: ' + line.slice(0, 64));
    else if ((nRx & 7) === 0) log('← ' + line.slice(0, 64));     // 抽样回显，保留日志输出
  } else {
    nBad++;
    if (nBad <= 3) log('← 乱码: ' + line.slice(0, 40));
  }
}
function renderStat(){
  const yn = k => fc[k] === '1' ? 'ON' : 'off';
  let s;
  if (!connected) s = '未连接';
  else {
    s = '已连接 <b>' + (device && device.name ? device.name : '') + '</b>｜发送 <b>' + nTx +
        '</b> 帧｜接收 <b>' + nRx + '</b> 字节' + (nBad ? '｜乱码 ' + nBad : '');
    if (fc.src)
      s += '<br>飞控: 源=<b>' + fc.src + '</b> 遥控=' + (fc.ppm === '1' ? '有效' : '无') +
           ' 接管锁=' + yn('tk') + ' 收到油门=<b>' + fc.pcT + '</b> CH3=' + fc.ch3 +
           ' 扑动=<b>' + yn('fly') + '</b> 直控=' + yn('dct');
    else if (nRx > 0)
      s += '<br>已收到 ' + nRx + ' 字节，但还没解析出状态行（固件 DEBUG_SERIAL 是否为 1？波特率是否 9600？）';
    else
      s += '<br>尚未收到飞控回传（固件 DEBUG_SERIAL=1 才会有）';
  }
  setStat(s);
}

/* ---------- UI ---------- */
function syncLabels(){
  $('vThr').textContent = Math.round(vals.thr);
  $('vStr').textContent = Math.round(vals.str);
  $('vLif').textContent = Math.round(vals.lif);
}
function bindSlider(id, key){
  const el = $(id);
  const upd = function(){ vals[key] = +el.value; pending[key] = Math.round(vals[key]); syncLabels(); };
  el.addEventListener('input', upd);
  el.addEventListener('change', upd);
}
bindSlider('thr','thr'); bindSlider('str','str'); bindSlider('lif','lif');

$('btnConnect').onclick = connect;
$('btnDisconnect').onclick = disconnect;
$('btnStop').onclick = function(){
  vals.thr = 0; $('thr').value = 0; pending.thr = 0; syncLabels();
  enqueueWrite(buildFrame(0x03, [1]), '急停');
  enqueueWrite(buildFrame(0x01, [0]), '油门0');
  log('⚠ 已急停');
};
$('btnCenter').onclick = function(){
  vals.str = 50; vals.lif = 50;
  $('str').value = 50; $('lif').value = 50;
  pending.str = 50; pending.lif = 50; syncLabels();
  enqueueWrite(buildFrame(0x03, [0]), '清急停');
  log('已回中');
};
$('btnStep').onclick = function(){
  log('升降阶跃：50 → 100（保持 2 秒）→ 50，看舵机臂');
  vals.lif = 100; $('lif').value = 100; pending.lif = 100; syncLabels();
  setTimeout(function(){
    vals.lif = 50; $('lif').value = 50; pending.lif = 50; syncLabels();
    log('阶跃结束');
  }, 2000);
};
$('btnExitD').onclick = function(){ enqueueWrite(buildFrame(0x30, []), '退出直控'); };

(function initHint(){
  const ua = navigator.userAgent || '';
  const ios = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let h = '';
  if (!navigator.bluetooth)
    h += ios
      ? '⚠ iPhone/iPad：系统 Safari 和 Chrome 都不支持 Web Bluetooth，需要装 <b>Bluefy</b> 或 <b>WebBLE</b> 这类浏览器再打开本页。<br>'
      : '⚠ 此浏览器不支持 Web Bluetooth，请用 Chrome / Edge。<br>';
  h += '用法：连接 → 列表里选 JDY-23 → 油门拖到 <b>≥45</b> 才扑动；差速转向、升降控俯仰。<br>' +
       '状态栏的 <b>收到油门=</b> 是飞控实际收到的值，跟着滑条变就说明指令到位了。';
  $('hint').innerHTML = h;
  log('页面加载完成，点【连接 JDY-23】开始');
  log(navigator.bluetooth ? '本浏览器支持 Web Bluetooth ✓'
                          : '本浏览器不支持 Web Bluetooth（iPhone 需用 Bluefy/WebBLE）');
})();
</script>
</body>
</html>
